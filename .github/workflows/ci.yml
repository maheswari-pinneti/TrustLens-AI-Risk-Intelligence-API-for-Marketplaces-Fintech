name: TrustLens CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed Database & Train Model
      run: |
        python scripts/seed_data.py
        python scripts/train_model.py
        python scripts/seed_db.py

    - name: Run Pytest Test Suite
      shell: bash
      run: |
        echo "=== Environment Info ==="
        python -V
        pip list | grep -iE "pytest|pydantic|sqlalchemy|scikit" || true
        echo "=== Running Pytest with Details ==="
        python -m pytest -v --tb=short 2>&1 | tee pytest_run.log
        TEST_EXIT=${PIPESTATUS[0]}
        if [ $TEST_EXIT -ne 0 ]; then
          echo "Pytest exited with code: $TEST_EXIT"
          LOG_SNIPPET=$(tail -n 20 pytest_run.log | tr '\n' ' ')
          echo "::error title=Pytest Failed Exit Code $TEST_EXIT::$LOG_SNIPPET"
          echo "## Pytest Run Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pytest_run.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $TEST_EXIT
        fi

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Build Vite Production Assets
      working-directory: ./frontend
      run: npm run build
