name: TrustLens CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed Database & Train Model
      run: |
        python scripts/seed_data.py
        python scripts/train_model.py
        python scripts/seed_db.py

    - name: Run Pytest Test Suite
      shell: bash
      run: |
        echo "=== Environment Info ==="
        python -V
        python -c "import sys; print('Python sys.path:', sys.path)"
        
        echo "=== Pytest Collect Only ==="
        python -m pytest --collect-only 2>&1 | tee collect.log || true
        
        echo "=== Pytest Execution ==="
        python -m pytest -v --tb=short 2>&1 | tee pytest_run.log || true
        
        if grep -q "passed" pytest_run.log && ! grep -q "FAILED" pytest_run.log && ! grep -q "ERROR" pytest_run.log; then
          echo "All tests passed successfully!"
          exit 0
        fi
        
        ERR_SNIPPET=$(grep -E "ERROR|FAILED|ModuleNotFoundError|ImportError|Exception" pytest_run.log collect.log | head -n 5 | tr '\n' ' | ')
        echo "::error title=Pytest Error::${ERR_SNIPPET:-Pytest collection failed}"
        echo "## Pytest Collection Log" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat collect.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "## Pytest Run Log" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat pytest_run.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit 1

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: |
          collect.log
          pytest_run.log

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Build Vite Production Assets
      working-directory: ./frontend
      run: npm run build
